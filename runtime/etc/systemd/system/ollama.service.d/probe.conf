[Service]
# This direct Ollama request cannot be satisfied by RavenDB's embedding cache.
# It pages the model in before RavenDB starts applying mmap pressure.
ExecStartPost=/bin/sh -c '\
  for i in $(seq 1 60); do \
    code=$(curl -sf -o /dev/null -w "%{http_code}" http://127.0.0.1:11434/api/tags || true); \
    [ "$code" = "200" ] && break; sleep 1; \
  done; \
  curl -sS --max-time 30 http://127.0.0.1:11434/api/embeddings \
    -H "Content-Type: application/json" \
    -d "{\"model\":\"snowflake-arctic-embed:s\",\"prompt\":\"hugin-ollama-preload\"}" \
    >/dev/null || true \
'
