interface=wlan0
bind-interfaces
listen-address=10.1.1.1
no-hosts

dhcp-range=10.1.1.2,10.1.1.254,255.255.255.0,72h
dhcp-option=option:router,10.1.1.1
dhcp-option=option:dns-server,10.1.1.1
dhcp-option=114,http://start.ravendb/
dhcp-option=160,http://start.ravendb/
dhcp-authoritative

# Resolve every hostname, including connectivity probes, to the appliance.
address=/#/10.1.1.1
